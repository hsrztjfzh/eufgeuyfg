<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd9e8">
<title>تولدت مبارک عشقم 🎀</title>
<style>
:root{--pink:#ff76a8;--hot:#f04486;--pale:#fff0f6;--ink:#8c3d61;--line:#ffc2d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff 0 5%,transparent 28%),radial-gradient(circle at 90% 80%,#ffe0ed,transparent 35%),linear-gradient(145deg,#fff5f9,#ffddea 55%,#fff0f6);overflow-x:hidden}
button{font:inherit}
.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 15px;position:relative}
.card{width:min(100%,650px);padding:clamp(24px,5vw,46px) 20px 34px;background:#ffffffc9;border:1px solid #fff;box-shadow:0 20px 70px #d84d8320,inset 0 0 0 1px #ffc8dc;border-radius:32px;text-align:center;position:relative;overflow:hidden}
.card:before,.card:after{content:"♡";position:absolute;color:#ff9dc0;font-size:48px;opacity:.6;animation:float 4s ease-in-out infinite}
.card:before{top:18px;right:22px}.card:after{bottom:22px;left:25px;animation-delay:-2s}
h1{font-size:clamp(1.65rem,5vw,2.7rem);line-height:1.55;color:#e83e80;margin:0 0 10px}
.subtitle{font-size:clamp(1.05rem,3vw,1.3rem);font-weight:700;margin:0 0 22px}
.tiny{font-size:.92rem;line-height:1.9;color:#a35475}
.gift-area{height:230px;display:grid;place-items:center;position:relative;margin:12px auto 8px}
.gift{font-size:clamp(100px,24vw,145px);line-height:1;cursor:pointer;user-select:none;filter:drop-shadow(0 12px 10px #d84d8330);transform-origin:50% 80%;transition:filter .2s}
.gift.shake{animation:shake .55s ease}
.gift.open{animation:openGift .65s ease forwards}
.bear{position:absolute;bottom:24px;font-size:clamp(65px,16vw,92px);opacity:0;transform:translateY(55px) scale(.35) rotate(-18deg);pointer-events:none;filter:drop-shadow(0 8px 7px #d84d8340)}
.bear.pop{animation:bearPop 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.counter{font-weight:700;color:#e83e80;margin:0 0 12px}
.btn{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(120deg,#ff8fba,#ed4787);color:#fff;font-weight:700;box-shadow:0 9px 20px #ed478733;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px #ed478744}
.btn:focus-visible{outline:3px solid #ad285c;outline-offset:3px}
.options{display:none;max-width:440px;margin:25px auto 0;gap:12px;flex-direction:column;animation:fadeUp .5s ease}
.options.show{display:flex}
.option{border:1px solid #ffc1d7;background:#fff8fb;color:#a53865;border-radius:18px;padding:14px 12px;cursor:pointer;font-weight:700;transition:transform .2s,background .2s}
.option:hover{transform:translateY(-2px);background:#ffe5ef}
.option:disabled{opacity:.65;cursor:default}
.feedback{display:none;margin:18px auto 0;line-height:1.9;font-weight:700;color:#d63877}
.feedback.show{display:block}
.music{position:fixed;bottom:14px;left:14px;z-index:5;border:1px solid #ffc2d8;background:#ffffffd9;color:#c53870;border-radius:999px;padding:10px 14px;box-shadow:0 6px 18px #d84d831c;cursor:pointer}
.music small{font-size:.8rem}
.heart{position:fixed;bottom:-30px;z-index:10;pointer-events:none;animation:rise linear forwards;color:#ff5f9b}
.sparkle{position:absolute;pointer-events:none;color:#ff75a8;animation:sparkle 1.2s ease-out forwards}
footer{font-size:.8rem;color:#b76b8b;margin-top:24px}
@keyframes shake{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-12deg) translateY(-4px)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg) translateY(-3px)}80%{transform:rotate(7deg)}}
@keyframes openGift{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.16) rotate(-8deg)}100%{transform:scale(.65) translateY(28px);opacity:.15}}
@keyframes bearPop{0%{opacity:0;transform:translateY(55px) scale(.35) rotate(-18deg)}55%{opacity:1;transform:translateY(-22px) scale(1.13) rotate(8deg)}75%{transform:translateY(5px) scale(.96) rotate(-4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes rise{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}
@keyframes sparkle{from{opacity:1;transform:scale(.4) translateY(0)}to{opacity:0;transform:scale(1.5) translateY(-70px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" aria-labelledby="title">
    <h1 id="title">سلاممم عشقم تولدت مبارک❤️😭</h1>
    <p class="subtitle">کادوت رو باز کن👇❤️</p>
    <p class="tiny">یه کادوی کوچولو، مخصوص یه آدم خیلی خاص 🎀</p>
    <div class="gift-area">
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="برای باز کردن کادو کلیک کن" onclick="tapGift()">🎁</div>
      <div class="bear" id="bear" aria-label="خرس صورتی">🧸</div>
    </div>
    <p class="counter" id="counter">۳ بار روی کادو کلیک کن 💗 (۰ از ۳)</p>
    <p class="tiny" id="helper">هر بار یه تکون کوچولو می‌خوره… 🤭</p>
    <div class="options" id="options" aria-label="نظر درباره کادو">
      <button class="option" onclick="choose('خیلی ممنون عشقم😭❤️',this)">خیلی ممنون عشقم😭❤️</button>
      <button class="option" onclick="choose('ممنون ولی خیلی باحال نبود🤧❤️',this)">ممنون ولی خیلی باحال نبود🤧❤️</button>
      <button class="option" onclick="choose('خوشم نیومد😮‍💨',this)">خوشم نیومد😮‍💨</button>
    </div>
    <div class="feedback" id="feedback" role="status"></div>
    <footer>با کلی عشق، فقط برای تو 💗</footer>
  </section>
</main>
<button class="music" id="musicBtn" onclick="toggleMusic()">🎵 پخش موسیقی</button>
<audio id="music" loop preload="none"><source src="music.mp3" type="audio/mpeg"></audio>
<script>
let taps=0, opened=false, chosen=false;
const gift=document.getElementById('gift'), bear=document.getElementById('bear');
function tapGift(){
 if(opened){heartBurst(5);return}
 taps++;
 gift.classList.remove('shake'); void gift.offsetWidth; gift.classList.add('shake');
 document.getElementById('counter').textContent=`۳ بار روی کادو کلیک کن 💗 (${taps} از ۳)`;
 heartBurst(4);
 if(taps>=3){
  opened=true;
  document.getElementById('counter').textContent='وااای کادوت باز شددد 😭💗';
  document.getElementById('helper').textContent='یه خرس صورتی کوچولو برای تووو 🧸🎀';
  gift.classList.add('open');
  setTimeout(()=>{gift.style.visibility='hidden';bear.classList.add('pop');document.getElementById('options').classList.add('show');heartBurst(24)},400);
 }
}
gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapGift()}});
function heartBurst(n){
 const chars=['💗','💕','♡','✨','🌸'];
 for(let i=0;i<n;i++){
  const el=document.createElement('span');el.className='heart';el.textContent=chars[Math.floor(Math.random()*chars.length)];
  el.style.left=(Math.random()*100)+'vw';el.style.fontSize=(16+Math.random()*20)+'px';el.style.animationDuration=(2.5+Math.random()*2.5)+'s';
  document.body.appendChild(el);setTimeout(()=>el.remove(),5500);
 }
}
async function choose(answer,button){
 if(chosen)return;
 chosen=true;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 const feedback=document.getElementById('feedback');
 feedback.textContent='نظر قشنگت ثبت شد 💗';
 feedback.classList.add('show');
 heartBurst(18);
 // IMPORTANT: configure this URL to point to your private backend before publishing.
 const endpoint='YOUR_BACKEND_URL_HERE/feedback';
 if(endpoint.startsWith('https://') && !endpoint.includes('YOUR_BACKEND_URL_HERE')){
  try{
   const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer, page:'Mahdis birthday gift'})});
   if(!r.ok)throw new Error('send failed');
   feedback.textContent='نظرت ثبت شد و یه کبوتر نامه‌بر هم فرستادیم 😭💗';
  }catch(e){feedback.textContent='نظرت انتخاب شد 💗 (ارسال تلگرام هنوز تنظیم نشده)';}
 }else{
  feedback.textContent='نظرت انتخاب شد 💗 (ارسال تلگرام هنوز تنظیم نشده)';
 }
}
async function toggleMusic(){
 const audio=document.getElementById('music'),btn=document.getElementById('musicBtn');
 if(!audio.paused){audio.pause();btn.textContent='🎵 پخش موسیقی';return}
 try{await audio.play();btn.textContent='⏸ توقف موسیقی'}catch(e){btn.textContent='🎵 فایل music.mp3 را اضافه کن'}
}
</script>
</body>
</html>
